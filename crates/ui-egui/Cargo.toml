[package]
name = "aurora-ui-egui"
description = "The Aurora egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aurora-time = { workspace = true }
aurora-geom = { workspace = true }
aurora-color = { workspace = true }
aurora-keyframe = { workspace = true }
aurora-project = { workspace = true }
aurora-path = { workspace = true }
aurora-text = { workspace = true }
aurora-render = { workspace = true }
aurora-engine = { workspace = true }
aurora-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "0.4"
aurora-host = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
