[package]
name = "aurora-script"
description = "Aurora scripting: JavaScript (boa) with an After Effects-style object model (app, project, CompItem, Layer, Property…) over the engine's undoable commands"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aurora-engine = { workspace = true }
aurora-project = { workspace = true }
aurora-keyframe = { workspace = true }
aurora-time = { workspace = true }
aurora-render = { workspace = true }
aurora-path = { workspace = true }
serde_json = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
aurora-expr = { workspace = true }
