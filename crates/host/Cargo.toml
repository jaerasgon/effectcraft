[package]
name = "aurora-host"
description = "Builds a fully wired Aurora session: media decoding (FilmCraft codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aurora-engine = { workspace = true }
aurora-project = { workspace = true }
aurora-media = { workspace = true }
aurora-expr = { workspace = true }
aurora-script = { workspace = true }
aurora-export = { workspace = true }
aurora-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aurora-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
aurora-psd = { workspace = true }
aurora-svg = { workspace = true }
aurora-pdf = { workspace = true }
aurora-raster = { workspace = true }
aurora-time = { workspace = true }
aurora-interchange = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
