[package]
name = "aurora-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aurora-time = { workspace = true }
aurora-geom = { workspace = true }
aurora-color = { workspace = true }
aurora-keyframe = { workspace = true }
aurora-project = { workspace = true }
aurora-raster = { workspace = true }
aurora-path = { workspace = true }
aurora-text = { workspace = true }
aurora-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
aurora-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
